# This rule is not used by the project ihpa-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to ihpa.ake.cyberagent.co.jp resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: ihpa-controller
    app.kubernetes.io/managed-by: kustomize
  name: fittingjob-viewer-role
rules:
- apiGroups:
  - ihpa.ake.cyberagent.co.jp
  resources:
  - fittingjobs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ihpa.ake.cyberagent.co.jp
  resources:
  - fittingjobs/status
  verbs:
  - get
