# This rule is not used by the project ihpa-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the ihpa.ake.cyberagent.co.jp.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: ihpa-controller
    app.kubernetes.io/managed-by: kustomize
  name: intelligenthorizontalpodautoscaler-editor-role
rules:
- apiGroups:
  - ihpa.ake.cyberagent.co.jp
  resources:
  - intelligenthorizontalpodautoscalers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ihpa.ake.cyberagent.co.jp
  resources:
  - intelligenthorizontalpodautoscalers/status
  verbs:
  - get
