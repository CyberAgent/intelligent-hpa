name: Lint

on:
  push:
  pull_request:

permissions: {}

jobs:
  lint:
    defaults:
      run:
        working-directory: ihpa-controller
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: ihpa-controller/go.mod
          cache-dependency-path: ihpa-controller/go.sum

      - name: Check linter configuration
        run: make lint-config
      - name: Run linter
        # TODO: fix lint error after merging the migration PR
        continue-on-error: true
        run: make lint
