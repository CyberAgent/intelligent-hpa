# This rule is not used by the project ihpa-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over ihpa.ake.cyberagent.co.jp.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: ihpa-controller
    app.kubernetes.io/managed-by: kustomize
  name: estimator-admin-role
rules:
- apiGroups:
  - ihpa.ake.cyberagent.co.jp
  resources:
  - estimators
  verbs:
  - '*'
- apiGroups:
  - ihpa.ake.cyberagent.co.jp
  resources:
  - estimators/status
  verbs:
  - get
