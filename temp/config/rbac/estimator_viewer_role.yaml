# permissions for end users to view estimators.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: temp
    app.kubernetes.io/managed-by: kustomize
  name: estimator-viewer-role
rules:
- apiGroups:
  - ihpa.ake.cyberagent.co.jp
  resources:
  - estimators
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ihpa.ake.cyberagent.co.jp
  resources:
  - estimators/status
  verbs:
  - get
